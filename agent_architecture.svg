<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Architecture: a scheduler feeds an autonomous six-stage reasoning loop that runs every ten minutes; a watchdog restarts the loop if it dies; a daily test agent browser-tests production; and a human approval gate the agent cannot cross sits between the finished package and the two irreversible actions, sending to the customer and marking work delivered." style="font-family:'IBM Plex Mono',ui-monospace,monospace;">
      <rect width="780" height="560" fill="#F4F5F7"/>
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#0E1014"/>
        </marker>
        <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
        </marker>
      </defs>

      <!-- Watchdog -->
      <rect x="290" y="18" width="200" height="52" rx="4" fill="none" stroke="#0E1014" stroke-width="1"/>
      <text x="390" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#0E1014">WATCHDOG</text>
      <text x="390" y="57" text-anchor="middle" font-size="10" fill="#0E1014" opacity="0.6">restarts loop if it dies · 3 min</text>
      <line x1="390" y1="70" x2="390" y2="112" stroke="#0E1014" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/>

      <!-- Scheduler -->
      <rect x="20" y="150" width="150" height="52" rx="4" fill="none" stroke="#0E1014" stroke-width="1"/>
      <text x="95" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#0E1014">SCHEDULER</text>
      <text x="95" y="189" text-anchor="middle" font-size="10" fill="#0E1014" opacity="0.6">enqueues work daily</text>
      <line x1="170" y1="176" x2="212" y2="176" stroke="#0E1014" stroke-width="1" marker-end="url(#ar)"/>

      <!-- Autonomous loop container -->
      <rect x="214" y="114" width="544" height="196" rx="8" fill="none" stroke="#0E1014" stroke-width="1.4"/>
      <text x="230" y="138" font-size="12" font-weight="600" fill="#0E1014">AUTONOMOUS LOOP</text>
      <text x="230" y="154" font-size="10" fill="#0E1014" opacity="0.6">reasoning agent · every 10 minutes</text>

      <!-- 6 stages -->
      <g font-size="11" fill="#0E1014" text-anchor="middle">
        <rect x="230" y="176" width="78" height="44" rx="4" fill="none" stroke="#0E1014" stroke-width="1"/><text x="269" y="202">Onboard</text>
        <rect x="316" y="176" width="78" height="44" rx="4" fill="none" stroke="#0E1014" stroke-width="1"/><text x="355" y="202">Source</text>
        <rect x="402" y="176" width="78" height="44" rx="4" fill="none" stroke="#0E1014" stroke-width="1"/><text x="441" y="202">Evaluate</text>
        <rect x="488" y="176" width="78" height="44" rx="4" fill="none" stroke="#0E1014" stroke-width="1"/><text x="527" y="196">Verify</text><text x="527" y="209">link live</text>
        <rect x="574" y="176" width="78" height="44" rx="4" fill="none" stroke="#0E1014" stroke-width="1"/><text x="613" y="202">Generate</text>
        <rect x="660" y="176" width="82" height="44" rx="4" fill="none" stroke="#0E1014" stroke-width="1"/><text x="701" y="202">Package</text>
      </g>
      <g stroke="#0E1014" stroke-width="1" marker-end="url(#ar)">
        <line x1="308" y1="198" x2="315" y2="198"/>
        <line x1="394" y1="198" x2="401" y2="198"/>
        <line x1="480" y1="198" x2="487" y2="198"/>
        <line x1="566" y1="198" x2="573" y2="198"/>
        <line x1="652" y1="198" x2="659" y2="198"/>
      </g>
      <!-- loop-back -->
      <path d="M701,220 L701,246 Q701,256 691,256 L279,256 Q269,256 269,246 L269,222" fill="none" stroke="#0E1014" stroke-width="1" opacity="0.55" stroke-dasharray="4 3" marker-end="url(#ar)"/>
      <text x="485" y="252" text-anchor="middle" font-size="10" fill="#0E1014" opacity="0.6">next pass — new work, deduped</text>

      <!-- finished package flows down, then STOPS at the gate (agent cannot cross) -->
      <path d="M701,310 L701,330 L408,330 L408,384" fill="none" stroke="#0E1014" stroke-width="1" marker-end="url(#ar)"/>
      <text x="556" y="324" text-anchor="middle" font-size="10" fill="#0E1014" opacity="0.6">finished package</text>

      <!-- HUMAN GATE (accent — the one meaningful element) -->
      <line x1="60" y1="392" x2="512" y2="392" stroke="#B45309" stroke-width="2.5"/>
      <text x="60" y="382" font-size="12" font-weight="600" fill="#B45309">HUMAN APPROVAL GATE</text>
      <text x="60" y="410" font-size="10" fill="#B45309" opacity="0.9">the agent's flow stops here — only a human sends or marks delivered</text>

      <!-- Operator (human) picks up below the gate -->
      <line x1="408" y1="392" x2="408" y2="430" stroke="#B45309" stroke-width="1.4" marker-end="url(#arA)"/>
      <rect x="288" y="430" width="240" height="46" rx="4" fill="none" stroke="#0E1014" stroke-width="1"/>
      <text x="408" y="458" text-anchor="middle" font-size="12" font-weight="600" fill="#0E1014">OPERATOR reviews &amp; approves</text>
      <g stroke="#0E1014" stroke-width="1" fill="none" marker-end="url(#ar)">
        <path d="M408,476 L408,499 L300,499"/>
        <path d="M408,476 L408,499 L516,499"/>
      </g>
      <text x="300" y="514" text-anchor="middle" font-size="11" fill="#0E1014">Send to customer</text>
      <text x="516" y="514" text-anchor="middle" font-size="11" fill="#0E1014">Mark delivered</text>

      <!-- Daily test agent — right column, clear of the package flow -->
      <rect x="592" y="430" width="166" height="62" rx="4" fill="none" stroke="#0E1014" stroke-width="1"/>
      <text x="675" y="452" text-anchor="middle" font-size="11" font-weight="600" fill="#0E1014">DAILY TEST AGENT</text>
      <text x="675" y="468" text-anchor="middle" font-size="9.5" fill="#0E1014" opacity="0.6">browser-tests every path</text>
      <text x="675" y="481" text-anchor="middle" font-size="9.5" fill="#0E1014" opacity="0.6">in production, once a day</text>
      <path d="M730,430 L730,313" fill="none" stroke="#0E1014" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/>
    </svg>